<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RA 1221608-1, Daniel Willys Cardozo da Silva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .header img {
            height: 50px;
        }
        .menu ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            background-color: #1a0469;
            overflow: hidden;
            border-radius: 5px;
        }
        .menu li {
            float: left;
        }
        .menu li a {
            display: block;
            color: #fcf8f8;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .menu li a:hover {
            background-color: #121347;
        }
        
        form {
            max-width: 600px;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }
        .radio-group,
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        button {
            background-color: #1a0469;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #121347;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="https://www.uniube.br/" target="_blank">
            <img src="imagens/uniube.svg" alt="Logotipo da Uniube">
        </a>
        <h1>ACQA <br>Técnologias para Internet</h1>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="index.html">Página Inicial</a></li>
            <li><a href="imagens.html">Imagens</a></li>
            <li><a href="links.html">Links</a></li>
            <li><a href="fale_conosco.html">Fale Conosco</a></li>
        </ul>
    </nav>
    
    <main>
        <h2>Fale Conosco</h2>
        <p>Preencha o formulário abaixo para entrar em contato.</p>

        <form action="#" method="post">
            
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-group">
                <label>Assunto do Contato:</label>
                <div class="radio-group">
                    <input type="radio" id="sugestao" name="assunto" value="sugestao" required>
                    <label for="sugestao">Sugestão</label>
                    <input type="radio" id="elogio" name="assunto" value="elogio">
                    <label for="elogio">Elogio</label>
                    <input type="radio" id="reclamacao" name="assunto" value="reclamacao">
                    <label for="reclamacao">Reclamação</label>
                </div>
            </div>

            <div class="form-group">
                <label for="interesse">Áreas de Interesse:</label>
                <select id="interesse" name="interesse">
                    <option value="logistica">Logística 4.0</option>
                    <option value="automacao">Automação Industrial</option>
                    <option value="dados">Análise de Dados</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
            </div>

            <button type="submit">Enviar Formulário</button>
        </form>
    </main>

</body>
</html>
